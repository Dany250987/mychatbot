apply plugin: 'com.android.application'

// ======================================================
// FIRMA RELEASE DANYBOT
// Prioridad:
// 1. Variables de entorno DANYBOT_*
// 2. Archivo privado fuera del proyecto:
//    %USERPROFILE%\DANYBOT-keys\danybot-signing.properties
//
// No se guardan contraseñas ni rutas privadas en Git.
// ======================================================

def danybotSigningProperties = new Properties()

def danybotSigningFile = new File(
        System.getProperty("user.home"),
        "DANYBOT-keys/danybot-signing.properties"
)

if (danybotSigningFile.exists()) {
    danybotSigningFile.withInputStream { stream ->
        danybotSigningProperties.load(stream)
    }
}

def danybotStoreFile =
        System.getenv("DANYBOT_STORE_FILE")
        ?: danybotSigningProperties.getProperty("storeFile")

def danybotStorePassword =
        System.getenv("DANYBOT_STORE_PASSWORD")
        ?: danybotSigningProperties.getProperty("storePassword")

def danybotKeyAlias =
        System.getenv("DANYBOT_KEY_ALIAS")
        ?: danybotSigningProperties.getProperty("keyAlias")

def danybotKeyPassword =
        System.getenv("DANYBOT_KEY_PASSWORD")
        ?: danybotSigningProperties.getProperty("keyPassword")

def hasDanybotReleaseSigning =
        danybotStoreFile &&
        danybotStorePassword &&
        danybotKeyAlias &&
        danybotKeyPassword


android {
    namespace = "com.danybot.agenda"
    compileSdk = rootProject.ext.compileSdkVersion

    defaultConfig {
        applicationId "com.danybot.agenda"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion

        versionCode 11
        versionName "1.2.8"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        aaptOptions {
            // Files and dirs to omit from the packaged assets dir,
            // modified to accommodate modern web apps.
            // Default:
            // https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61

            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }

    // ==================================================
    // CONFIGURACIÓN DE FIRMA RELEASE
    // Solo se activa si están disponibles las 4
    // propiedades requeridas.
    // ==================================================

    signingConfigs {
        if (hasDanybotReleaseSigning) {
            release {
                storeFile file(danybotStoreFile)
                storePassword danybotStorePassword
                keyAlias danybotKeyAlias
                keyPassword danybotKeyPassword
            }
        }
    }

    buildTypes {
        release {
            if (hasDanybotReleaseSigning) {
                signingConfig signingConfigs.release
            }

            minifyEnabled false

            proguardFiles(
                    getDefaultProguardFile('proguard-android.txt'),
                    'proguard-rules.pro'
            )
        }
    }
}
repositories {
    flatDir {
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}


dependencies {
    implementation fileTree(
            include: ['*.jar'],
            dir: 'libs'
    )

    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"

    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"

    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"

    implementation project(':capacitor-android')

    testImplementation "junit:junit:$junitVersion"

    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"

    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"

    implementation project(':capacitor-cordova-android-plugins')
}


apply from: 'capacitor.build.gradle'


try {
    def servicesJSON = file('google-services.json')

    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }

} catch (Exception e) {
    logger.info(
            "google-services.json not found, google-services plugin not applied. Push Notifications won't work"
    )
}